<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Сама</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 105, 180, 0.45), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(117, 84, 255, 0.5), transparent 35%),
        linear-gradient(135deg, #180d35, #5a176b 48%, #e02f76);
    }

    .background-circle {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(3px);
      animation: float 7s ease-in-out infinite;
    }

    .circle-one {
      top: -100px;
      left: -80px;
    }

    .circle-two {
      right: -100px;
      bottom: -90px;
      width: 390px;
      height: 390px;
      animation-delay: -3s;
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(88vw, 430px);
      min-height: 620px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 35px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.35),
        inset 0 0 30px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      color: white;
      font-size: clamp(42px, 12vw, 72px);
      line-height: 1;
      letter-spacing: 8px;
      text-shadow: 0 0 20px rgba(255, 158, 211, 0.8);
    }

    .subtitle {
      max-width: 280px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      line-height: 1.7;
    }

    .heart-wrapper {
      position: relative;
      width: 230px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: heartbeat 2.4s ease-in-out infinite;
    }

    .heart {
      position: absolute;
      width: 145px;
      height: 145px;
      transform: rotate(-45deg);
      border-radius: 18px;
      background: linear-gradient(135deg, #ff4f91, #c40852 60%, #70042f);
      box-shadow:
        0 0 18px #ff4f91,
        0 0 45px rgba(255, 55, 139, 0.75),
        inset -10px -12px 20px rgba(83, 0, 33, 0.35);
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 145px;
      height: 145px;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before {
      top: -72px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 72px;
    }

    .heart-text {
      position: relative;
      z-index: 2;
      color: #fff;
      font-family: 'Marck Script', cursive;
      font-size: 43px;
      letter-spacing: 2px;
      transform: rotate(-8deg);
      text-shadow: 2px 3px 3px rgba(92, 0, 42, 0.5);
    }

    .button {
      padding: 14px 28px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      color: white;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff4f91, #9d35e8);
      box-shadow: 0 8px 22px rgba(255, 67, 151, 0.35);
      transition: 0.3s ease;
    }

    .button:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 12px 30px rgba(255, 67, 151, 0.55);
    }

    .sparkle {
      position: absolute;
      color: white;
      opacity: 0.8;
      animation: sparkle 2s ease-in-out infinite;
    }

    .sparkle:nth-child(1) {
      top: 22%;
      left: 13%;
      font-size: 24px;
    }

    .sparkle:nth-child(2) {
      top: 34%;
      right: 13%;
      font-size: 17px;
      animation-delay: 0.7s;
    }

    .sparkle:nth-child(3) {
      bottom: 18%;
      left: 18%;
      font-size: 14px;
      animation-delay: 1.2s;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      10% {
        transform: scale(1.06);
      }

      20% {
        transform: scale(1);
      }

      30% {
        transform: scale(1.04);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-22px) rotate(8deg);
      }
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.8) rotate(0deg);
      }

      50% {
        opacity: 1;
        transform: scale(1.25) rotate(20deg);
      }
    }

    @media (max-width: 480px) {
      .card {
        min-height: 560px;
        padding: 28px 18px;
      }

      .heart-wrapper {
        transform: scale(0.9);
      }

      .heart-text {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>
  <div class="background-circle circle-one"></div>
  <div class="background-circle circle-two"></div>

  <span class="sparkle">✦</span>
  <span class="sparkle">✧</span>
  <span class="sparkle">✦</span>

  <main class="card">
    <div>
      <div class="label"></div>
      <h1>сама такая</h1>
    </div>

    <div class="heart-wrapper">
      <div class="heart"></div>
      <div class="heart-text">без негатива</div>
    </div>

    <p class="subtitle">

    </p>

    <button class="button" onclick="showMessage()">
      Нажми на меня ✨
    </button>
  </main>

  <script>
    function showMessage() {
      const button = document.querySelector('.button');

      button.textContent = 'чего обзываемся девушка 💖';

      setTimeout(() => {
        button.textContent = 'Нажми на меня ✨';
      }, 3000);
    }
  </script>
</body>
</html>
